name: Descomprimir y compilar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: compilar-apk
  cancel-in-progress: true

jobs:
  build:
    name: Descomprimir ZIP y compilar APK
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Buscar, descomprimir y ubicar el proyecto
        id: proyecto
        run: |
          # 1. Buscar el ZIP (sin importar si tiene mayúsculas o minúsculas)
          ZIP=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname "*.zip" | head -1)
          
          if [ -z "$ZIP" ]; then
            echo "ERROR: No se encontró ningún archivo .zip en la raíz del repositorio."
            exit 1
          fi
          
          echo "ZIP encontrado: $ZIP"
          rm -rf /tmp/proyecto
          mkdir -p /tmp/proyecto
          
          # 2. Descomprimir
          unzip -q -o "$ZIP" -d /tmp/proyecto
          
          # 3. Descomprimir ZIPs anidados si los hubiera
          find /tmp/proyecto -iname "*.zip" | while read -r Z; do
            unzip -q -o "$Z" -d "$(dirname "$Z")" && rm -f "$Z"
          done
          
          # 4. Buscar el settings.gradle SIN límite de profundidad (para atravesar la doble carpeta)
          SETTINGS=$(find /tmp/proyecto -name "settings.gradle*" -not -path "*/build/*" | head -1)
          
          if [ -z "$SETTINGS" ]; then
            echo "ERROR FATAL: No se encontró settings.gradle."
            echo "--- CONTENIDO DEL ZIP DESCOMPRIMIDO ---"
            ls -R /tmp/proyecto | head -n 50
            exit 1
          fi
          
          # 5. Obtener la ruta exacta donde está el proyecto
          DIR=$(dirname "$SETTINGS")
          echo "Proyecto encontrado en: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      # Bypass de firma por si el proyecto no tiene el keystore configurado
      - name: Configurar firma de respaldo
        working-directory: ${{ steps.proyecto.outputs.dir }}
        run: |
          if [ -f "app/build.gradle" ] && ! grep -q "signingConfigs" app/build.gradle; then
            sed -i '/buildTypes {/,/}/ s/release {/release {\n            signingConfig signingConfigs.debug/' app/build.gradle
          fi

      - name: Compilar APK
        working-directory: ${{ steps.proyecto.outputs.dir }}
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Preparar APK
        id: apk
        working-directory: ${{ steps.proyecto.outputs.dir }}
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          
          if [ -z "$APK" ]; then
            echo "ERROR: no se generó el APK. Revisa los logs de compilación de Gradle."
            exit 1
          fi
          
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          CODE=$((100 + GITHUB_RUN_NUMBER))
          mkdir -p "$GITHUB_WORKSPACE/salida"
          cp "$APK" "$GITHUB_WORKSPACE/salida/SonidoIndependiente-v$VERSION.apk"
          
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: SonidoIndependiente-v${{ steps.apk.outputs.version }}
          path: salida/SonidoIndependiente-v${{ steps.apk.outputs.version }}.apk
          retention-days: 90

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}
          name: "Sonido Independiente v${{ steps.apk.outputs.version }}"
          body: |
            APK listo para instalar. Tus datos se conservan al instalar encima de la versión anterior.
            VersionCode: ${{ steps.apk.outputs.code }}
          files: salida/SonidoIndependiente-v${{ steps.apk.outputs.version }}.apk
          make_latest: true
          token: ${{ secrets.GITHUB_TOKEN }}
